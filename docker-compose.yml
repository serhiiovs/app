services:
  postgres:
    image: postgres:16
    container_name: currency-postgres
    platform: linux/amd64
    environment:
      POSTGRES_DB: currency
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: currency-backend
    platform: linux/amd64
    environment:
      DB_HOST: postgres
      DB_NAME: currency
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: currency-frontend
    # platform: linux/amd64
    depends_on:
      - backend
    ports:
      - "3000:80"

  cron:
    build:
      context: ./cron
    container_name: currency-cron
    platform: linux/amd64
    environment:
      DB_HOST: postgres
      DB_NAME: currency
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - cron

volumes:
  pgdata:
